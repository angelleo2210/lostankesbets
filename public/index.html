<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LosTankesBets</title><style>
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:560px;margin:auto;padding:12px}
.card{background:#1e293b;border-radius:12px;padding:12px;margin:10px 0}h1{font-size:18px;font-weight:600;letter-spacing:-.01em}h2{font-size:16px;font-weight:600;margin:4px 0 8px}
input,button,select{font-family:inherit;font-size:14px;line-height:1.3;padding:9px 10px;border-radius:8px;border:0;margin:3px 0;width:100%;box-sizing:border-box}
button{background:#22c55e;color:#041;font-weight:600}button.alt{background:#334155;color:#e2e8f0}button.red{background:#ef4444;color:#fff}
nav{display:flex;gap:4px;flex-wrap:wrap}
.avpv{position:fixed;right:10px;bottom:10px;z-index:50;pointer-events:none;width:125px;text-align:center;background:#1e293bee;border:1px solid #475569;border-radius:14px;box-shadow:0 6px 18px #000b;padding:4px;margin:0}
.avpv svg{width:100%;height:auto;max-height:32vh}
#bld{padding-bottom:min(45vh,240px)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.item{position:relative;text-align:center;margin:0;background:linear-gradient(160deg,#243044,#111827);border:1px solid #334155;box-shadow:0 4px 14px #0008}.item.premium{border-color:#fbbf24;box-shadow:0 0 14px #fbbf2455}.item.exclusive{border:1px solid #a5f3fc;box-shadow:0 0 18px #67e8f9aa,0 0 4px #fff inset}.item.owned{outline:2px solid #22c55e}.tag{position:absolute;top:6px;left:6px;z-index:2;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:linear-gradient(90deg,#fde68a,#f59e0b);color:#1f2937}.exclusive .tag{background:linear-gradient(90deg,#a5f3fc,#e0e7ff,#f0abfc)}.ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#0b1220;margin-bottom:6px}.ph img{width:100%;height:100%;object-fit:cover;display:block}.depts{margin:8px 0;flex-wrap:nowrap;overflow-x:auto}.depts .chip{flex:none}.chip.on{background:#22c55e;color:#06210f}.swb.on{outline:2px solid #fff;outline-offset:1px}.stk{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px}.stk.fire{background:#7c2d1233;color:#fdba74;border:1px solid #fb923c66}.stk.ice{background:#0c4a6e33;color:#bae6fd;border:1px solid #7dd3fc66}.stk.big{font-size:14px;padding:6px 12px;margin:8px 0}.bono{margin:6px 0}.bono button{width:100%;background:linear-gradient(90deg,#f59e0b,#facc15);color:#1f2937;font-weight:600}.ok{color:#4ade80}.sell{margin-top:4px}h3{margin:10px 0 6px;font-size:14px;font-weight:600;color:#cbd5e1}.swr{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}.swb{width:20px!important;height:20px;padding:0!important;border-radius:50%;border:1px solid #fff6;flex:none!important}
.bet-won{background:rgba(34,197,94,.22);border:1px solid #22c55e;border-left:6px solid #22c55e}
.bet-lost{background:rgba(239,68,68,.22);border:1px solid #ef4444;border-left:6px solid #ef4444}
@media(min-width:700px){.avpv{width:160px;right:20px;bottom:20px}}nav button{flex:1;padding:7px 6px;font-size:13px}.row{display:flex;gap:6px}.row>*{flex:1}
.opt{display:flex;justify-content:space-between;align-items:center;gap:6px}.small{font-size:12px;color:#94a3b8}.err{color:#f87171}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{width:auto;padding:5px 9px;font-size:12px}.sw{width:30px;height:30px;padding:0;border:2px solid #475569;border-radius:50%}.sw.on{border:3px solid #fff;box-shadow:0 0 0 2px #22c55e}h1 svg{margin-right:4px}summary{cursor:pointer;padding:6px 0}
b,strong{font-weight:600}input{font-size:16px}
.rps-pick{display:flex;gap:10px;flex-wrap:wrap}.rps-pick button{flex:1;min-width:100px;padding:12px;font-size:18px;font-weight:800}.rps-vs{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}.rps-res.won,.opt.won{background:#14532d;border-color:#22c55e}.rps-res.lost,.opt.lost{background:#7f1d1d;border-color:#ef4444}.rps-res{text-align:center}
/*b*/.retos{grid-template-columns:1fr 1fr}
.chat{background:#0f172a;border-radius:10px;padding:8px;margin:8px 0}.chat-l{max-height:160px;overflow:auto;margin:6px 0}.msg{background:#1e293b;border-radius:8px;padding:4px 8px;margin:3px 30px 3px 0;font-size:13px;word-wrap:break-word}.msg.me{background:#14532d;margin:3px 0 3px 30px}
.stage{position:relative;border-radius:12px;overflow:hidden;line-height:0}.stage svg{width:100%;height:auto}.anlbl{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);opacity:0;font-size:34px;font-weight:800;line-height:1;padding:6px 14px;border-radius:12px;white-space:nowrap;animation:lbl .45s cubic-bezier(.2,1.6,.4,1) forwards}.anlbl.won{background:#16a34aee;color:#fff;box-shadow:0 0 24px #22c55e}.anlbl.lost{background:#dc2626ee;color:#fff;box-shadow:0 0 24px #ef4444}@keyframes lbl{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.confeti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;animation:conf 1.6s ease-in forwards;animation-delay:inherit;opacity:0}.confeti{position:absolute;inset:0;pointer-events:none}.confeti i{animation:conf 1.6s .9s ease-in forwards}@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(230px) rotate(540deg)}}
.pen-an .kicker{animation:pk .6s ease-in forwards}@keyframes pk{to{transform:translate(24px,-8px)}}
.pen-an .ball{animation:pb .55s .55s cubic-bezier(.3,.6,.4,1) forwards}@keyframes pb{to{transform:translate(var(--bx),var(--by)) scale(.75)}}
.pen-an .keeper{transform-origin:150px 90px;animation:pg .45s .62s ease-out forwards}@keyframes pg{to{transform:translate(var(--kx),4px) rotate(var(--kr))}}
.bb-an .ball{animation:bp .45s ease-in forwards}@keyframes bp{to{transform:translate(4px,46px)}}
.bb-an.jonron .ball,.bb-an.strike .ball.hit{animation:bp .4s ease-in forwards,hr 1s .45s cubic-bezier(.2,.7,.5,1) forwards}@keyframes hr{0%{transform:translate(4px,46px)}50%{transform:translate(-40px,-110px) scale(1.6)}100%{transform:translate(-90px,-190px) scale(.4);opacity:0}}
.bb-an .bat{transform-origin:162px 198px}.bb-an.jonron .bat,.bb-an.out .bat,.bb-an.ponche .bat{animation:sw .25s .35s ease-out forwards}@keyframes sw{to{transform:rotate(-80deg)}}
.bb-an.jonron .flash{animation:fl .35s .4s ease-out}@keyframes fl{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(2.2)}}
.bb-an .runner{transform:translate(150px,200px);opacity:0}.bb-an.jonron .runner{animation:run 1.2s 1.3s linear forwards}@keyframes run{0%{opacity:1;transform:translate(150px,200px)}25%{transform:translate(205px,145px)}50%{transform:translate(150px,90px)}75%{transform:translate(95px,145px)}100%{opacity:1;transform:translate(150px,200px)}}
.bb-an.base .runner{animation:walk .8s .5s ease-out forwards}@keyframes walk{0%{opacity:1;transform:translate(150px,200px)}100%{opacity:1;transform:translate(205px,145px)}}
.bb-an.intro .ball{animation:none}.bb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bb-grid button{font-size:12px;padding:6px 2px;line-height:1.2}
.bb-rules{background:#7f1d1d;color:#fff;font-weight:700;border-radius:10px;padding:8px;margin:6px 0;font-size:14px}.bb-sb{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}.bb-sb td,.bb-sb th{border:1px solid #334155;padding:4px;text-align:center}.bb-sb td:first-child{text-align:left}
.tc-big{display:flex;gap:8px;margin:6px 0}.tc-big>div{flex:1;background:#0f172a;border-radius:12px;padding:6px;text-align:center}.tc-big b{display:block;font-size:40px;line-height:1.1}.tc-big b.lost{color:#ef4444}
.tc-bar{position:relative;height:22px;border-radius:11px;background:linear-gradient(90deg,#7f1d1d,#ca8a04 25%,#ca8a04 75%,#7f1d1d);margin:8px 0;overflow:hidden}.tc-zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:#16a34a}.tc-bar i{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #000;left:0}
.tc-rack{display:flex;gap:6px;justify-content:center;margin:4px 0}.tc-rack i{width:18px;height:18px;border-radius:50%;background:#475569}.tc-rack i.money{outline:2px solid #facc15}.tc-rack i.in{background:#22c55e}.tc-rack i.out{background:#ef4444}
.anlbl.gold{background:#ca8a04ee;box-shadow:0 0 24px #facc15}button.big{font-size:20px;padding:14px}
.tc-court .tc-ball{transform:translate(var(--sx),var(--sy))}.tc-court.shoot .tc-ball{animation:tcarc .8s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes tcarc{0%{transform:translate(var(--sx),var(--sy))}50%{transform:translate(var(--mx),20px) scale(1.25)}100%{transform:translate(150px,190px) scale(.8)}}
.tc-court.shoot.out .tc-ball{animation:tcmiss .8s cubic-bezier(.3,.1,.5,1) forwards}@keyframes tcmiss{0%{transform:translate(var(--sx),var(--sy))}50%{transform:translate(var(--mx),20px) scale(1.25)}80%{transform:translate(160px,186px)}100%{transform:translate(190px,170px) scale(.8)}}
.tc-court.shoot .tc-pl{animation:tcj .35s ease-out}@keyframes tcj{50%{translate:0 -10px}}.tc-court .tc-pl{transition:transform .5s}
@media(prefers-reduced-motion:reduce){.tc-court *{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){.pen-an *,.bb-an *,.anlbl,.confeti i{animation:none!important}.anlbl{opacity:1;transform:translate(-50%,-50%)}}.stk.fire.intense{background:linear-gradient(90deg,#7f1d1d,#ea580c,#facc15);color:#fff;box-shadow:0 0 12px #f97316;animation:stkp 1.2s ease-in-out infinite alternate}.stk.ice.intense{background:linear-gradient(90deg,#0c4a6e,#38bdf8,#e0f2fe);color:#082f49;box-shadow:0 0 12px #7dd3fc;animation:stkp 1.6s ease-in-out infinite alternate}@keyframes stkp{to{filter:brightness(1.25)}}@media(prefers-reduced-motion:reduce){.stk.intense{animation:none}}.retos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.retot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px}.pen-sb{display:flex;justify-content:space-between;align-items:center;background:#0f172a;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13px}.pen-sb b{font-size:22px}.pen-dots{display:flex;gap:4px;justify-content:center;min-height:18px}.ph{position:relative}.thav{position:absolute;right:3px;bottom:2px;background:#0f172acc;border-radius:10px;padding:2px 4px;line-height:0}.combo{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#111827;margin:8px 0}.cbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cav{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);filter:drop-shadow(0 6px 10px #000a)}.cmoto{position:absolute;right:4%;bottom:5%;width:34%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 16px #000c}.cmoto img{width:100%;height:100%;object-fit:cover}.ccap{position:absolute;left:8px;top:8px;background:#0009;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}</style></head><body><main id="app"></main><script src="avatar.js"></script><script src="store.js"></script><script src="app.js"></script></body></html>
