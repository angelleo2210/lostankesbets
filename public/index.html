<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LosTankesBets</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:560px;margin:auto;padding:12px}
.card{background:#1e293b;border-radius:12px;padding:12px;margin:10px 0}h1{font-size:20px}h2{font-size:17px;margin:4px 0 8px}
input,button,select{font-size:16px;padding:10px;border-radius:8px;border:0;margin:3px 0;width:100%;box-sizing:border-box}
button{background:#22c55e;color:#041;font-weight:700}button.alt{background:#334155;color:#e2e8f0}button.red{background:#ef4444;color:#fff}
nav{display:flex;gap:4px;flex-wrap:wrap}
.avpv{position:fixed;right:10px;bottom:10px;z-index:50;pointer-events:none;width:125px;text-align:center;background:#1e293bee;border:1px solid #475569;border-radius:14px;box-shadow:0 6px 18px #000b;padding:4px;margin:0}
.avpv svg{width:100%;height:auto;max-height:32vh}
#bld{padding-bottom:min(45vh,240px)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.item{position:relative;text-align:center;margin:0;background:linear-gradient(160deg,#243044,#111827);border:1px solid #334155;box-shadow:0 4px 14px #0008}.item.premium{border-color:#fbbf24;box-shadow:0 0 14px #fbbf2455}.item.exclusive{border:1px solid #a5f3fc;box-shadow:0 0 18px #67e8f9aa,0 0 4px #fff inset}.item.owned{outline:2px solid #22c55e}.tag{position:absolute;top:6px;left:6px;z-index:2;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:linear-gradient(90deg,#fde68a,#f59e0b);color:#1f2937}.exclusive .tag{background:linear-gradient(90deg,#a5f3fc,#e0e7ff,#f0abfc)}.isvg svg{width:100%;height:auto;display:block;border-radius:10px}.sw{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:6px 0}.swb{width:20px!important;height:20px;padding:0!important;border-radius:50%;border:1px solid #fff6;flex:none!important}.sw input[type=color]{width:28px;height:22px;padding:0;border:0}
.bet-won{background:rgba(34,197,94,.22);border:1px solid #22c55e;border-left:6px solid #22c55e}
.bet-lost{background:rgba(239,68,68,.22);border:1px solid #ef4444;border-left:6px solid #ef4444}
@media(min-width:700px){.avpv{width:160px;right:20px;bottom:20px}}nav button{flex:1;padding:8px;font-size:14px}.row{display:flex;gap:6px}.row>*{flex:1}
.opt{display:flex;justify-content:space-between;align-items:center;gap:6px}.small{font-size:13px;color:#94a3b8}.err{color:#f87171}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{width:auto;padding:6px 9px;font-size:13px}.sw{width:30px;height:30px;padding:0;border:2px solid #475569;border-radius:50%}.sw.on{border:3px solid #fff;box-shadow:0 0 0 2px #22c55e}h1 svg{margin-right:4px}summary{cursor:pointer;padding:6px 0}
</style></head><body><main id="app"></main><script src="avatar.js"></script><script src="store.js"></script><script src="app.js"></script></body></html>
